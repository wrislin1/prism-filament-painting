<section class="mt-4" aria-labelledby="report-title">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h2 id="report-title" class="text-lg font-semibold">Predicted accuracy</h2>
          <button id="studio-report" type="button" class="btn btn-quiet" disabled>Calculate report</button>
        </div>
        <p id="report-status" role="status" class="mt-2 text-sm"></p>
        <div id="report-result" hidden>
          <p id="report-score" class="font-semibold" aria-live="polite"></p>
          <p class="text-sm text-muted">Lower is closer. Comparison covers every visible source pixel under neutral lighting.</p>
          <div class="mt-3 grid gap-3 sm:grid-cols-2">
            <figure>
              <img id="report-heat" class="w-full" alt="Spatial distribution of predicted colour error">
              <figcaption id="report-heat-legend" class="mt-1 text-sm"></figcaption>
            </figure>
            <figure>
              <label class="field">Cannot reach level
                <select id="reach-level" aria-describedby="reach-shares"></select>
              </label>
              <p class="text-xs text-muted">2 uses the calibration wedge’s match tolerance. 5 highlights moderate misses. 10 isolates larger differences.</p>
              <p id="reach-shares" class="text-xs text-muted"></p>
              <img id="report-flags" class="w-full" alt="Source pixels outside the current stack’s colour tolerance">
              <figcaption id="report-flag-legend" class="mt-1 text-sm"></figcaption>
            </figure>
          </div>
        </div>
      </section>
