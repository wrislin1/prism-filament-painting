[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-filament-painting"
version = "0.1.2"
description = "Design and print layered filament paintings locally."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt", "licenses/catalogues/*.txt"]
authors = [{name = "wrislin1"}]
dependencies = [
  "fastapi==0.136.3", "uvicorn==0.48.0", "jinja2==3.1.6",
  "python-multipart==0.0.30", "pydantic>=2.11,<3", "numpy==2.4.6",
  "pillow==12.2.0", "colour-science==0.4.7", "trimesh==4.12.2",
]

[project.optional-dependencies]
optimize = [
  "torch==2.9.1+cpu; sys_platform == 'linux' or sys_platform == 'win32'",
  "torch==2.9.1; sys_platform != 'linux' and sys_platform != 'win32'",
]
catalogues = ["PyYAML==6.0.3"]
mcp = ["mcp==1.30.0"]

[project.scripts]
prism-filament-painting = "prism_filament_painting.launcher:main"
prism-calibrate = "prism_filament_painting.calibration.cli:main"
prism-palette-mcp = "prism_filament_painting.mcp.cli:main"

[tool.setuptools.packages.find]
include = ["prism_filament_painting*"]

[tool.setuptools.package-data]
"prism_filament_painting.workspace" = ["templates/*.html", "static/*.css", "static/*.js", "static/studio/*.js"]
"prism_filament_painting.palette" = ["data/*.csv"]
